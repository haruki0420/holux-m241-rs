name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/m241-app/ui/pnpm-lock.yaml
      # `tauri-build` embeds `ui/dist` while the crate compiles, so the frontend
      # has to be built before clippy runs over the workspace.
      - name: Build the Tauri frontend
        run: |
          pnpm --dir crates/m241-app/ui install --frozen-lockfile
          pnpm --dir crates/m241-app/ui build
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Docs links
        run: python3 tools/check_docs.py
      - name: Design invariants
        run: python3 tools/check_design.py
      - name: Safety invariants
        run: python3 tools/check_safety.py

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `serialport` links libudev on Linux; egui links the X11/Wayland stack;
      # the Tauri app links webkit2gtk 4.1.
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/m241-app/ui/pnpm-lock.yaml
      - name: Build the Tauri frontend
        run: |
          pnpm --dir crates/m241-app/ui install --frozen-lockfile
          pnpm --dir crates/m241-app/ui build
      - name: Test
        run: cargo test --workspace

  # The Tauri v2 rewrite. Linux does a real `cargo build`; Windows and macOS are
  # compile checks, which is what the requirement asks for while the app is P0.
  # The frontend must be built first: `tauri-build` embeds `ui/dist`.
  tauri:
    name: tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libudev-dev pkg-config
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/m241-app/ui/pnpm-lock.yaml
      - name: Build the frontend
        run: |
          pnpm --dir crates/m241-app/ui install --frozen-lockfile
          pnpm --dir crates/m241-app/ui build
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cargo build -p m241-app
      - name: Check (Windows / macOS)
        if: runner.os != 'Linux'
        run: cargo check -p m241-app

  build:
    name: build release binaries
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: m241-linux-x86_64
          - os: windows-latest
            artifact: m241-windows-x86_64
          - os: macos-latest
            artifact: m241-macos-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/m241-app/ui/pnpm-lock.yaml
      - name: Build the Tauri frontend
        run: |
          pnpm --dir crates/m241-app/ui install --frozen-lockfile
          pnpm --dir crates/m241-app/ui build
      - name: Build
        # The Tauri app is not a release artifact yet (P0 is a debug-build
        # proof); it is compiled by the `tauri` job below.
        run: cargo build --release --workspace --exclude m241-app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/m241
            target/release/m241.exe
            target/release/m241-gui
            target/release/m241-gui.exe
          if-no-files-found: warn
          retention-days: 7
