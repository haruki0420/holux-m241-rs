[workspace]
resolver = "3"
members = [
    "crates/m241-core",
    "crates/m241-flash",
    "crates/m241-cli",
    "crates/m241-gui",
    # The Tauri v2 rewrite (P0: the Connect screen). It links `m241-core` only;
    # `m241-flash` arrives in P3. The egui `m241-gui` stays until parity.
    "crates/m241-app",
]

[workspace.package]
# The four crates inherit this (`version.workspace = true`); bump only here at
# release time. `release.yml` checks the `vX.Y.Z` tag against this value.
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["holux-m241-rs contributors"]
repository = "https://github.com/haruki0420/holux-m241-rs"

# Only what is used today. Declaring a dependency before its consumer exists
# produces a permanent "unused workspace dependency" warning and hides the real
# ones. `walkers` (map tiles) is a separate change because it needs the network
# at runtime.
[workspace.dependencies]
m241-core = { path = "crates/m241-core" }
# The write path is a separate crate on purpose: a binary that only reads must
# not be able to link it. See `crates/m241-flash/src/lib.rs` and
# `tools/check_safety.py`.
m241-flash = { path = "crates/m241-flash" }
thiserror = "2"
serialport = "4"
# KMZ long-edge reduction (spec §6.3) needs a JPEG decoder and encoder. Only the
# `jpeg` feature is enabled; the other format back-ends are not built. The
# reduction is in `crates/m241-core/src/log/kmz.rs`.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Reading a KMZ needs one inflate for the deflate entries a KMZ normally holds;
# `zip` itself is not pulled in because only `doc.kml` is ever read. The
# pure-Rust backend keeps the dependency C-toolchain-free like `image`'s.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"
egui = "0.37"
eframe = "0.37"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Dev builds are for checking, not for running: debug info on this workspace
# costs ~3 GB per worktree and the parallel streams each get one. Line tables
# without full type info keep backtraces readable at a quarter of the size.
# Bump to 1 locally when you actually need to debug something.
[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
