[workspace]
resolver = "3"
members = ["crates/m241-core", "crates/m241-cli", "crates/m241-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["holux-m241-rs contributors"]
repository = "https://github.com/haruki0420/holux-m241-rs"

# Only what is used today. Declaring a dependency before its consumer exists
# produces a permanent "unused workspace dependency" warning and hides the real
# ones. `serde` / `serde_json` return with the profile database; `walkers` (map
# tiles) is a separate change because it needs the network at runtime.
[workspace.dependencies]
m241-core = { path = "crates/m241-core" }
thiserror = "2"
serialport = "4"
egui = "0.37"
eframe = "0.37"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
