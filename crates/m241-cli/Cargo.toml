[package]
name = "m241-cli"
description = "Command line interface for the Holux M-241"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "m241"
path = "src/main.rs"

[dependencies]
m241-core.workspace = true
# `fw flash` and `log erase` are the commands that write to the device, and they
# are the reason the CLI depends on the write crate as well as on `m241-core`.
# Both dependencies are unconditional because this binary ships those
# subcommands: the read-only surface is `m241-core` itself, and a tool that only
# needs it does not link this binary.
m241-flash.workspace = true
clap.workspace = true
# `--json` prints one object per command (`docs/reference/02-cli.md` §Output).
# The core exports JSON as text because it has no dependency budget; the CLI
# needs to *build* a document, so it owns this dependency.
serde_json.workspace = true
# `m241 device ports` reports which USB-serial bridge each port is. The vendor
# and product ids only exist on `serialport`'s `SerialPortInfo`, and the core's
# `Port::list` deliberately returns names alone.
serialport.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
