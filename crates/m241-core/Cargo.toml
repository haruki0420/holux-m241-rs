[package]
name = "m241-core"
description = "Protocol, firmware and log handling for the Holux M-241 GPS logger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
serialport.workspace = true
# JPEG decode/encode for the KMZ long-edge limit (spec §6.3). `jpeg` is the
# only feature enabled in the workspace declaration.
image.workspace = true
# KMZ reading: `doc.kml` is usually a deflated ZIP entry.
flate2.workspace = true

# serde / serde_json / tracing return when the profile database and the
# structured output land. Leaving them declared now only produces warnings.

[lints]
workspace = true
