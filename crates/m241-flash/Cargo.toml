[package]
name = "m241-flash"
description = "The write path for the Holux M-241: log erasure and firmware flashing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The dependency direction is the safety property: this crate may depend on the
# read-only crate, never the other way round. `tools/check_safety.py` fails the
# build if that direction is ever reversed.
[dependencies]
m241-core.workspace = true

[features]
# The fake Download Agent, for this crate's tests and for a dependent crate's
# end-to-end test of a command that drives the write path. Off by default: a
# shipped binary has no reason to carry a destructive command set's model. This
# crate's own unit tests use it through `cfg(test)` either way.
simulator = []

[lints]
workspace = true
