[package]
name = "m241-gui"
description = "Desktop UI for the Holux M-241"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "m241-gui"
path = "src/main.rs"

[dependencies]
egui.workspace = true
eframe.workspace = true

# `m241-core` joins this list when the GUI first performs real work: reading a
# firmware image, listing a log, driving a session. Declared before then it is
# an unused dependency, and an unused dependency is a warning that hides the
# real one. The shell today owns navigation and tokens only.

# walkers (map tiles) is deliberately not a dependency yet: it fetches tiles over
# the network at runtime and cannot be exercised headlessly. The Log screen draws
# the track itself on a scaled canvas; a slippy map is a later, separate change.

[lints]
workspace = true
