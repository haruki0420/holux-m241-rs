[package]
name = "m241-gui"
description = "Desktop UI for the Holux M-241"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "m241-gui"
path = "src/main.rs"

[dependencies]
m241-core.workspace = true
# The GUI's Firmware screen writes firmware, so it links the write crate. The
# write path is the same `DownloadAgent` session the CLI uses, through
# `m241_flash::flow`; `tools/check_safety.py` now requires this dependency
# instead of forbidding it, and still forbids `m241-core` from reaching it.
m241-flash.workspace = true
egui.workspace = true
eframe.workspace = true
# The `log project save|load` JSON document the CLI defines. The GUI reads and
# writes the same schema, so a project made here loads with `m241 log project
# load` and the reverse; a hand-written parser would be a second schema.
serde_json.workspace = true
# Writing the PNGs that `--screenshot` produces. Chosen over a hand-written
# compressor because a screenshot is a review artifact and a byte-exact encoder
# is not this crate's subject; `png` is already in the tree through eframe's
# image support, so this costs no new build.
png = "0.18"
# The same system-font fallback `eframe` installs when it opens a window. The
# screenshots are rendered without `eframe` (no window), and without this the
# Japanese labels rasterise as empty boxes — an image that misrepresents the UI.
egui_system_font_provider = "0.37"
# Background map tiles (DESIGN.md §5, §10). One blocking HTTP client with no async
# runtime of its own; `rustls` rather than the OS TLS stack keeps the build
# self-contained on the three supported platforms.
#
# NETWORK GATE — this dependency replaces a rule, and the rule is recorded here
# because nothing checks it mechanically. Until PR #39 the GUI deliberately did
# not link a network client: a fetch cannot be exercised headlessly, so there was
# no way to prove an offline path stayed offline. The user asked for a real map,
# which needs tiles, so the rule was lifted for this one module — not because the
# concern was wrong.
#
# What is guaranteed now: every fetch goes through `tiles::TileFetcher`, so the
# tests inject a fake and never open a socket; `tiles::has_window` gates fetching
# on `native_pixels_per_point` (a headless `RawInput` has none, and Wayland has
# one even though it has no `inner_rect`), and `MapOptions.sample` keeps
# `--screenshot` offline. `app::tests` counts fetcher calls to prove that a
# headless draw starts none.
#
# What is NOT guaranteed: this is not a mechanical gate like the read/write split
# in `tools/check_safety.py`. A later change that adds a second network consumer
# elsewhere in this crate would not fail any check. Tiles are the GUI's only
# network consumer; anything else has to carry the same seam and update this note
# and DESIGN.md §10.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Decoding the PNG (and, if a server ever answers with one, JPEG) that a tile
# server returns. The encoders are not used: encoding a tile is not a thing this
# crate does. (The screenshot's PNG writer above is a separate dependency.)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# The OS cache directory (`XDG_CACHE_HOME` on Linux, Known Folders on Windows,
# `Library/Caches` on macOS) under which the tile cache lives.
dirs = "7"

[lints]
workspace = true

[dev-dependencies]
# The write-path tests drive the same fake DA the write crate's protocol tests
# use. The feature is off for the shipped binary, so the simulator is not linked
# into `m241-gui` itself.
m241-flash = { workspace = true, features = ["simulator"] }
